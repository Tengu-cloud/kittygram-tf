services:
  postgres:
    image: postgres:13
    container_name: postgres
    volumes:
      - pg_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: ${DOCKER_USERNAME}/kittygram_backend:latest
    container_name: backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - SECRET_KEY=${SECRET_KEY}
      - DB_HOST=postgres
      - DB_PORT=5432
    volumes:
      - static:/app/collected_static
      - media:/app/media
    restart: always
    command: >
      gunicorn kittygram_backend.wsgi:application --bind 0.0.0.0:8000

  frontend:
    image: ${DOCKER_USERNAME}/kittygram_frontend:latest
    container_name: frontend
    volumes:
      - frontend_dist:/static
    command: >
      bash -c "cp -r /app/build/. /static/ && tail -f /dev/null"
    restart: always

  gateway:
    image: ${DOCKER_USERNAME}/kittygram_gateway:latest
    container_name: gateway
    entrypoint: ["nginx", "-g", "daemon off;"]
    ports:
      - "9000:80"
    volumes:
      - static:/static
      - media:/media
      - frontend_dist:/usr/share/nginx/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    restart: always
    depends_on:
      - backend
      - frontend

volumes:
  pg_data:
  static:
  media:
  frontend_dist:
